# Trileza — declarative backend configuration.
#
# Applied with:  npx @insforge/cli config apply
# Compare first: npx @insforge/cli config plan
#
# This file holds settings, never secrets. The SMTP password is set separately
# with `insforge secrets`, so it is not committed here.

[auth]
allowed_redirect_urls = []
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

# Password rules.
#
# Six characters with no other requirement let "123456" through on a platform
# that holds payment details and pays authors real money.
#
# The character classes were tightened separately, directly on the project.
# This file matches that rather than relaxing it, and raises the length, which
# is the part that actually resists guessing: "Passw0rd!" satisfies every class
# rule here and is on every breach list, while ten characters is not.
[auth.password]
min_length = 10
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

# Email delivery.
#
# While `enabled = false`, verification codes cannot be sent — and because
# `require_email_verification` is true, every new signup stalls at the code
# screen with no way forward. The two settings have to move together.
#
# Fill in host, username and sender_email, set enabled = true, then store the
# password separately:
#
#     npx @insforge/cli secrets add SMTP_PASSWORD
#
# Gmail needs an app password, not the account password, and port 465 with
# implicit TLS (587 is STARTTLS, which this expects to be 465).
[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = "Trileza"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50
